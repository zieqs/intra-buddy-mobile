name: intra_buddy_mobile_v2
description: "Student-facing mobile app for UniKL internship management"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  supabase_flutter: ^2.12.4
  flutter_riverpod: ^3.3.1
  go_router: ^17.2.3
  dartz: ^0.10.1
  json_annotation: ^4.11.0
  image_picker: ^1.1.0
  file_picker: ^11.0.2
  url_launcher: ^6.3.1
  flutter_dotenv: ^6.0.1
  pdfx: ^2.11.0
  flutter_local_notifications: ^22.3.3
  timezone: ^0.11.2
  flutter_timezone: ^5.1.1
  audioplayers: ^6.8.1
  shared_preferences: ^2.5.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  riverpod_lint: ^3.1.3
  build_runner: ^2.4.0
  json_serializable: ^6.9.4
  mocktail: ^1.0.4
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8
  fake_async: ^1.3.3

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/audio/
    - assets/branding/intra_buddy_mark.png
  fonts:
    - family: Fredoka
      fonts:
        - asset: assets/fonts/Fredoka-400.ttf
        - asset: assets/fonts/Fredoka-500.ttf
          weight: 500
        - asset: assets/fonts/Fredoka-600.ttf
          weight: 600
    - family: Nunito
      fonts:
        - asset: assets/fonts/Nunito-400.ttf
        - asset: assets/fonts/Nunito-600.ttf
          weight: 600
        - asset: assets/fonts/Nunito-700.ttf
          weight: 700
        - asset: assets/fonts/Nunito-800.ttf
          weight: 800

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/branding/intra_buddy_icon.png"
  adaptive_icon_background: "assets/branding/intra_buddy_adaptive_background.png"
  adaptive_icon_foreground: "assets/branding/intra_buddy_adaptive_foreground.png"
  adaptive_icon_foreground_inset: 0
  remove_alpha_ios: true

flutter_native_splash:
  color: "#FFFFFF"
  image: assets/branding/intra_buddy_splash.png
  android: true
  ios: true
  web: false
  android_12:
    color: "#FFFFFF"
    image: assets/branding/intra_buddy_splash_android12.png
